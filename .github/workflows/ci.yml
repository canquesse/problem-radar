name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Syntax check
        run: for f in src/*.js src/sources/*.js web/app.js scripts/*.js; do node --check "$f"; done
      - name: Scenario tests
        run: npm test
      - name: Build site from an empty store
        run: DATA_DIR=$(mktemp -d) DIST_DIR=dist node src/cli.js build && test -f dist/index.html && test -f dist/feed.xml
