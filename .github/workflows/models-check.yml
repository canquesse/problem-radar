name: Models check

# Manual check that GitHub Models (free tier) answers from Actions with the
# workflow token. The radar uses it, when available, to write ideas in Turkish.
on:
  workflow_dispatch:

permissions:
  models: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the model for one Turkish sentence
        run: |
          curl -sS https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" \
            -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Reply in Turkish with one short sentence: what is a product idea for people who reconcile LLM invoices by hand?"}],"max_tokens":80}' \
            -D headers.txt -o body.json
          grep -iE "^(HTTP|x-ratelimit)" headers.txt || true
          cat body.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
