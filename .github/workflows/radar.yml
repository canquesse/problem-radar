name: Radar sync and deploy

# Hourly at minute 17: off the top of the hour, when GitHub's scheduler is
# busiest and delays runs the most. The UI shows per-source freshness, so a
# late run is visible instead of silent.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'web/**', '.github/workflows/radar.yml']

# Never let two syncs write the data branch at the same time. Queue instead
# of cancelling so a run that is mid-way finishes and saves its cursors.
concurrency:
  group: radar-sync
  cancel-in-progress: false

permissions:
  contents: write   # push the data branch
  pages: write      # deploy GitHub Pages
  id-token: write   # required by deploy-pages
  actions: write    # keep the scheduled workflow enabled

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch the data branch (records, cursors, ETags, changelog)
        run: |
          git clone --depth 1 --branch data "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data-branch \
            || { echo "No data branch yet, starting empty"; mkdir -p data-branch; }
          mkdir -p data-branch/data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync GitHub and Hacker News
        run: node src/cli.js sync
        env:
          DATA_DIR: data-branch/data
          # Optional: a read-only fine-grained PAT in the RADAR_TOKEN secret.
          # GITHUB_TOKEN is minted fresh for every run and GitHub's ETags vary
          # by token, so conditional requests only produce 304s with a stable
          # token. Without the secret everything still works on GITHUB_TOKEN.
          GITHUB_TOKEN: ${{ secrets.RADAR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Save the data branch
        # A single orphan commit, force-pushed: the store stays small and the
        # append-only changelog (events.json) is the history that matters.
        # This push is also repository activity, which keeps GitHub from
        # auto-disabling the schedule after 60 quiet days.
        run: |
          cd data-branch
          rm -rf .git
          git init -q -b data
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# Problem Radar data\n\nGenerated by the "Radar sync and deploy" workflow. Do not edit by hand.\n' > README.md
          git add -A
          git commit -q -m "Radar data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Source health
        run: node scripts/health.js data-branch/data

      - name: Keep the schedule enabled
        # Belt and braces for the 60-day auto-disable of scheduled workflows.
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/radar.yml/enable" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build site
        run: node src/cli.js build
        env:
          DATA_DIR: data-branch/data
          DIST_DIR: dist
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
